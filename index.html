<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Բավրայի Բնակչությունը</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      padding: 20px;
      color: #0f172a;
    }

    .chart-card {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid #e2e8f0;
    }

    .chart-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .chart-header h2 {
      margin: 0 0 6px 0;
      font-size: 1.4rem;
      color: #1e293b;
    }

    .chart-header p {
      margin: 0;
      font-size: 0.9rem;
      color: #64748b;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      overflow-x: auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="chart-card">
    <div class="chart-header">
      <h2>Բավրա Գյուղի Բնակչության Դիանամիկան</h2>
      <p>Պատմական տվյալներ (1897 - 2026 թթ.)</p>
    </div>

    <div class="canvas-wrapper">
      <canvas id="bavraPopCanvas" width="800" height="380"></canvas>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const popData = [
        { year: "1897", count: 262 },
        { year: "1926", count: 205 },
        { year: "1939", count: 286 },
        { year: "1959", count: 510 },
        { year: "1970", count: 562 },
        { year: "1979", count: 602 },
        { year: "1989", count: 538 },
        { year: "2001", count: 538 },
        { year: "2011", count: 490 },
        { year: "2014", count: 570 },
        { year: "2026", count: 450 }
      ];

      const canvas = document.getElementById('bavraPopCanvas');
      const ctx = canvas.getContext('2d');

      const padding = { top: 50, right: 30, bottom: 60, left: 60 };
      const chartWidth = canvas.width - padding.left - padding.right;
      const chartHeight = canvas.height - padding.top - padding.bottom;

      const maxVal = 700;
      const barSpacing = 16;
      const barWidth = Math.floor((chartWidth - (barSpacing * (popData.length + 1))) / popData.length);

      // Background Grid
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#f1f5f9';
      ctx.fillStyle = '#64748b';
      ctx.font = '500 12px system-ui';
      ctx.textAlign = 'right';

      for (let v = 0; v <= maxVal; v += 100) {
        const y = canvas.height - padding.bottom - (v / maxVal) * chartHeight;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(canvas.width - padding.right, y);
        ctx.stroke();
        ctx.fillText(v, padding.left - 10, y + 4);
      }

      // Draw Bars and Labels
      popData.forEach((d, i) => {
        const x = padding.left + barSpacing + i * (barWidth + barSpacing);
        const barH = (d.count / maxVal) * chartHeight;
        const y = canvas.height - padding.bottom - barH;

        // Gradient for Bars
        const gradient = ctx.createLinearGradient(0, y, 0, canvas.height - padding.bottom);
        gradient.addColorStop(0, '#2563eb');
        gradient.addColorStop(1, '#60a5fa');

        ctx.fillStyle = gradient;

        // Rounded Top Corners
        const radius = 6;
        ctx.beginPath();
        ctx.moveTo(x, y + barH);
        ctx.lineTo(x, y + radius);
        ctx.arcTo(x, y, x + radius, y, radius);
        ctx.lineTo(x + barWidth - radius, y);
        ctx.arcTo(x + barWidth, y, x + barWidth, y + radius, radius);
        ctx.lineTo(x + barWidth, y + barH);
        ctx.closePath();
        ctx.fill();

        // Count Value Label Above Bar
        ctx.fillStyle = '#1e293b';
        ctx.font = '600 12px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(d.count, x + barWidth / 2, y - 10);

        // Year Label Under X-Axis
        ctx.fillStyle = '#475569';
        ctx.font = '500 12px system-ui';
        ctx.fillText(d.year, x + barWidth / 2, canvas.height - padding.bottom + 24);
      });

      // Axis Baseline
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padding.left, canvas.height - padding.bottom);
      ctx.lineTo(canvas.width - padding.right, canvas.height - padding.bottom);
      ctx.stroke();
    });
  </script>
</body>
</html>
