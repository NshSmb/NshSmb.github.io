<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bavra Village & Game Portal</title>

  <!-- Google Search Console Verification Tags -->
  <meta name="google-site-verification" content="XsxHx6m0rEKXIkFuPx1kfXAYUuzOw-c5oDJPiqMQ1Yg" />
  <meta name="google-site-verification" content="8M9y0Vgoe-TP1JpAhWdcMWux43WLA2QJqt1JGW_IBVM" />

  <style>
    :root {
      --bg-primary: #121212;
      --bg-card: #1e1e1e;
      --accent-color: #00e676;
      --text-main: #ffffff;
      --text-sub: #b0bec5;
      --border-color: #333333;
      --btn-bg: #2a2a2a;
    }

    /* Light Theme Overrides */
    body.light-theme {
      --bg-primary: #f4f6f8;
      --bg-card: #ffffff;
      --accent-color: #2e7d32;
      --text-main: #121212;
      --text-sub: #546e7a;
      --border-color: #e0e0e0;
      --btn-bg: #e8e8e8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    .theme-toggle-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 1.2rem;
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    h1 {
      font-size: 2rem;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .widget-bar {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .widget-item {
      font-size: 0.95rem;
      color: var(--text-sub);
    }

    .widget-item span {
      color: var(--text-main);
      font-weight: bold;
    }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 12px;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    /* Victorina Nshan Styling */
    .quiz-option {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
      font-size: 1rem;
    }

    .quiz-option:hover {
      opacity: 0.9;
    }

    .quiz-analysis {
      margin-top: 12px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.05);
      border-left: 4px solid var(--accent-color);
      border-radius: 4px;
      font-size: 0.95rem;
      color: var(--text-sub);
      display: none;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
    }

    .nav-btn {
      background: var(--accent-color);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Canvas Game */
    #game-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    canvas {
      background: #181824;
      width: 100%;
      max-width: 760px;
      height: 360px;
      display: block;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 12px;
      background: #111;
    }

    .control-btn {
      width: 60px;
      height: 60px;
      background: #2a2a2a;
      border: 2px solid var(--accent-color);
      color: #fff;
      font-size: 1.2rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .control-btn:active {
      background: var(--accent-color);
      color: #000;
    }
  </style>
</head>
<body>

  <header>
    <!-- Toggle showing Sun in Dark mode, Moon in Light mode -->
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
    <h1>Bavra Portal</h1>
    <div class="widget-bar">
      <div class="widget-item">Time: <span id="live-clock">--:--:--</span></div>
      <div class="widget-item">Bavra Temp: <span id="weather-temp">14°C</span></div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>About Bavra</h2>
      <p style="color: var(--text-sub); line-height: 1.5;">
        Bavra is a high-altitude border village located in the Shirak Province of Armenia, known for its mountain climate, scenic landscapes, and resilient community spirit.
      </p>
    </section>

    <!-- Victorina Nshan -->
    <section class="card">
      <h2>Victorina Nshan</h2>
      <p id="quiz-question" style="font-weight: bold; margin-bottom: 10px;"></p>
      
      <div id="quiz-options"></div>

      <div id="quiz-analysis" class="quiz-analysis"></div>

      <div class="quiz-nav">
        <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">◄ Previous</button>
        <button class="nav-btn" id="next-btn" onclick="nextQuestion()">Next ►</button>
      </div>
    </section>

    <!-- 2D Canvas Game -->
    <section class="card">
      <h2>2D Runner Game</h2>
      <div id="game-container">
        <canvas id="gameCanvas" width="760" height="360"></canvas>
        <div class="controls">
          <div style="display: flex; gap: 10px;">
            <button class="control-btn" id="btn-left">◄</button>
            <button class="control-btn" id="btn-right">►</button>
          </div>
          <button class="control-btn" id="btn-jump">▲</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Theme Switcher (Dark = Sun icon, Light = Moon icon)
    function toggleTheme() {
      const body = document.body;
      const themeBtn = document.getElementById("themeBtn");
      body.classList.toggle("light-theme");

      if (body.classList.contains("light-theme")) {
        themeBtn.innerText = "🌙"; // Bright mode active -> Show Moon
      } else {
        themeBtn.innerText = "☀️"; // Dark mode active -> Show Sun
      }
    }

    // Live Clock
    function updateClock() {
      const now = new Date();
      document.getElementById("live-clock").innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Victorina Nshan Questions Data
    const quizData = [
      {
        question: "1. In which region of Armenia is Bavra located?",
        options: ["Syunik", "Shirak", "Lori"],
        correct: 1,
        analysis: "Analysis: Correct! Bavra is situated in the north-western Shirak region near the border."
      },
      {
        question: "2. What climate characteristic is typical for Bavra's high elevation?",
        options: ["Tropical Heat", "Cold Mountain Winds", "Desert Dryness"],
        correct: 1,
        analysis: "Analysis: Correct! Being high in Shirak's plateau, cold mountain weather and harsh winds are common."
      },
      {
        question: "3. Which piece is at the core of opening setup strategies in chess?",
        options: ["Pawn Center Control", "Early Queen Attacks", "Corner Rooks"],
        correct: 0,
        analysis: "Analysis: Strategic control of the central squares using Pawns forms the bedrock of chess fundamentals."
      }
    ];

    let currentQ = 0;

    function renderQuiz() {
      const q = quizData[currentQ];
      document.getElementById("quiz-question").innerText = q.question;
      
      const optContainer = document.getElementById("quiz-options");
      optContainer.innerHTML = "";

      q.options.forEach((opt, index) => {
        const btn = document.createElement("button");
        btn.className = "quiz-option";
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(index);
        optContainer.appendChild(btn);
      });

      document.getElementById("quiz-analysis").style.display = "none";
      document.getElementById("prev-btn").disabled = currentQ === 0;
      document.getElementById("next-btn").disabled = currentQ === quizData.length - 1;
    }

    function selectAnswer(index) {
      const q = quizData[currentQ];
      const analysisBox = document.getElementById("quiz-analysis");
      
      if (index === q.correct) {
        analysisBox.style.color = "var(--accent-color)";
        analysisBox.innerText = "✅ " + q.analysis;
      } else {
        analysisBox.style.color = "#ff5252";
        analysisBox.innerText = "❌ Incorrect. Try again! (" + q.analysis + ")";
      }
      analysisBox.style.display = "block";
    }

    function nextQuestion() {
      if (currentQ < quizData.length - 1) {
        currentQ++;
        renderQuiz();
      }
    }

    function prevQuestion() {
      if (currentQ > 0) {
        currentQ--;
        renderQuiz();
      }
    }

    renderQuiz();

    // Canvas 2D Game Logic
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 50, y: 280, width: 30, height: 40, dx: 0, dy: 0, speed: 4, gravity: 0.5, jumpPower: -10, grounded: false };
    let keys = { left: false, right: false };

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
      if ((e.key === "ArrowUp" || e.key === "w" || e.key === " ") && player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
      if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
    });

    const setupTouch = (id, startFn, endFn) => {
      const btn = document.getElementById(id);
      btn.addEventListener("touchstart", (e) => { e.preventDefault(); startFn(); });
      btn.addEventListener("touchend", (e) => { e.preventDefault(); endFn(); });
      btn.addEventListener("mousedown", startFn);
      btn.addEventListener("mouseup", endFn);
    };

    setupTouch("btn-left", () => keys.left = true, () => keys.left = false);
    setupTouch("btn-right", () => keys.right = true, () => keys.right = false);
    setupTouch("btn-jump", () => {
      if (player.grounded) {
        player.dy = player.jumpPower;
        player.grounded = false;
      }
    }, () => {});

    function update() {
      if (keys.right) player.dx = player.speed;
      else if (keys.left) player.dx = -player.speed;
      else player.dx = 0;

      player.dy += player.gravity;
      player.x += player.dx;
      player.y += player.dy;

      if (player.y + player.height >= 320) {
        player.y = 320 - player.height;
        player.dy = 0;
        player.grounded = true;
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#2e7d32";
      ctx.fillRect(0, 320, canvas.width, 40);
      ctx.fillStyle = "#00e676";
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
