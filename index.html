<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Parkour Game</title>
    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }
        canvas {
            background: #e0e0e0;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .ui-panel {
            margin-top: 15px;
            background: #333;
            padding: 10px 20px;
            border-radius: 6px;
        }
        .ui-panel input {
            width: 80px;
            text-align: center;
            text-transform: lowercase;
            font-weight: bold;
            margin: 0 10px 0 5px;
            border: 1px solid #555;
            background: #222;
            color: #00ffcc;
        }
        #ctrl-power {
            width: 30px;
        }
        .info-text {
            margin-top: 8px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div class="ui-panel">
        <strong>Customize Controls:</strong>
        <label>Left: <input type="text" id="ctrl-left" value="ArrowLeft"></label>
        <label>Right: <input type="text" id="ctrl-right" value="ArrowRight"></label>
        <label>Jump: <input type="text" id="ctrl-jump" value="ArrowUp"></label>
        <label>Power: <input type="text" id="ctrl-power" value="v" maxlength="1"></label>
    </div>
    <div class="info-text">Press <strong>R</strong> to Restart Level/Run</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let controls = { left: 'arrowleft', right: 'arrowright', jump: 'arrowup', power: 'v' };
        
        document.querySelectorAll('.ui-panel input').forEach(input => {
            input.addEventListener('input', (e) => {
                const action = e.target.id.split('-')[1];
                controls[action] = e.target.value.toLowerCase();
            });
        });

        const keys = {};

        window.addEventListener('keydown', (e) => { 
            const key = e.key.toLowerCase();

            if (key === 'r' && document.activeElement.tagName !== 'INPUT') {
                restartGame();
            }

            if (key === controls.jump && !keys[controls.jump] && document.activeElement.tagName !== 'INPUT') {
                handleJumpPress();
            }
            keys[key] = true; 
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const player = {
            x: 30, y: 300,
            w: 20, h: 40,
            vx: 0, vy: 0,
            speed: 0.8, maxSpeed: 6,
            jumpPower: -10,
            grounded: false,
            wallSlide: false,
            wallDir: 0,
            jumpsLeft: 2
        };

        const gravity = 0.2;
        const friction = 0.85;

        const levels = [
            // LEVEL 1
            {
                platforms: [
                    { x: 0, y: 380, w: 800, h: 20 },
                    { x: 220, y: 300, w: 100, h: 20 },
                    { x: 400, y: 220, w: 100, h: 20 },
                    { x: 580, y: 140, w: 140, h: 20 },
                    { x: 150, y: 180, w: 30, h: 120 }
                ],
                hazards: [
                    { x: 330, y: 365, w: 120, h: 15 },
                    { x: 0, y: 0, w: 800, h: 20 }
                ],
                coins: [
                    { x: 270, y: 260, r: 15 },
                    { x: 450, y: 180, r: 15 },
                    { x: 650, y: 100, r: 15 }
                ],
                goal: { x: 670, y: 80, w: 30, h: 60 }
            },
            // LEVEL 2
            {
                platforms: [
                    { x: 0, y: 380, w: 180, h: 20 },
                    { x: 620, y: 380, w: 180, h: 20 },
                    { x: 230, y: 180, w: 40, h: 200 },
                    { x: 450, y: 120, w: 40, h: 200 },
                    { x: 50, y: 200, w: 90, h: 20 },
                    { x: 540, y: 140, w: 100, h: 20 }
                ],
                hazards: [
                    { x: 180, y: 385, w: 440, h: 15 },
                    { x: 0, y: 0, w: 800, h: 20 }
                ],
                coins: [
                    { x: 95, y: 160, r: 15 },
                    { x: 250, y: 120, r: 15 },
                    { x: 590, y: 100, r: 15 }
                ],
                goal: { x: 590, y: 80, w: 30, h: 60 }
            },
            // LEVEL 3
            {
                platforms: [
                    { x: 0, y: 380, w: 100, h: 20 },
                    { x: 160, y: 320, w: 50, h: 20 },
                    { x: 270, y: 250, w: 50, h: 20 },
                    { x: 390, y: 180, w: 50, h: 20 },
                    { x: 520, y: 120, w: 50, h: 20 },
                    { x: 650, y: 120, w: 120, h: 20 }
                ],
                hazards: [
                    { x: 100, y: 380, w: 700, h: 20 },
                    { x: 0, y: 0, w: 800, h: 20 }
                ],
                coins: [
                    { x: 185, y: 280, r: 15 },
                    { x: 295, y: 210, r: 15 },
                    { x: 415, y: 140, r: 15 },
                    { x: 545, y: 80, r: 15 }
                ],
                goal: { x: 710, y: 60, w: 30, h: 60 }
            },
            // LEVEL 4
            {
                platforms: [
                    { x: 0, y: 380, w: 140, h: 20 },
                    { x: 190, y: 310, w: 30, h: 90 },
                    { x: 300, y: 230, w: 30, h: 90 },
                    { x: 410, y: 150, w: 30, h: 90 },
                    { x: 520, y: 200, w: 90, h: 20 },
                    { x: 660, y: 130, w: 120, h: 20 }
                ],
                hazards: [
                    { x: 140, y: 385, w: 660, h: 15 },
                    { x: 0, y: 0, w: 800, h: 20 },
                    { x: 340, y: 110, w: 100, h: 15 }
                ],
                coins: [
                    { x: 205, y: 260, r: 15 },
                    { x: 315, y: 180, r: 15 },
                    { x: 565, y: 160, r: 15 },
                    { x: 710, y: 90, r: 15 }
                ],
                goal: { x: 720, y: 70, w: 30, h: 60 }
            },
            // LEVEL 5
            {
                platforms: [
                    { x: 0, y: 380, w: 110, h: 20 },
                    { x: 170, y: 310, w: 60, h: 20 },
                    { x: 290, y: 240, w: 60, h: 20 },
                    { x: 410, y: 170, w: 60, h: 20 },
                    { x: 540, y: 230, w: 60, h: 20 },
                    { x: 670, y: 150, w: 120, h: 20 }
                ],
                hazards: [
                    { x: 110, y: 385, w: 690, h: 15 },
                    { x: 0, y: 0, w: 800, h: 20 },
                    { x: 220, y: 140, w: 160, h: 15 },
                    { x: 480, y: 295, w: 120, h: 15 }
                ],
                coins: [
                    { x: 200, y: 270, r: 15 },
                    { x: 320, y: 200, r: 15 },
                    { x: 440, y: 130, r: 15 },
                    { x: 570, y: 190, r: 15 },
                    { x: 720, y: 110, r: 15 }
                ],
                goal: { x: 730, y: 90, w: 30, h: 60 }
            }
        ];

        let currentLevel = 0;
        let activePlatforms = [];
        let activeHazards = [];
        let activeCoins = [];
        let activeGoal = {};
        let score = 0;
        let deaths = 0;
        let gameWon = false;

        let startTime = Date.now();
        let levelStartTime = Date.now();
        let elapsedTime = 0;

        let levelSplits = [];
        let splitPopup = { text: '', timer: 0 };

        let pbTime = localStorage.getItem('parkour_pbTime');
        let pbDeaths = localStorage.getItem('parkour_pbDeaths');
        let isNewPB = false;

        function loadLevel(index) {
            if (index >= levels.length) {
                gameWon = true;
                checkPersonalBests();
                return;
            }
            const lvl = levels[index];
            activePlatforms = lvl.platforms;
            activeHazards = lvl.hazards;
            activeGoal = lvl.goal;
            activeCoins = lvl.coins.map(c => ({ ...c, collected: false }));
            
            levelStartTime = Date.now();
            player.x = 30;
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
        }

        function checkPersonalBests() {
            isNewPB = false;
            let currentSec = parseFloat(elapsedTime);
            
            if (pbTime === null || currentSec < parseFloat(pbTime)) {
                pbTime = elapsedTime;
                localStorage.setItem('parkour_pbTime', pbTime);
                isNewPB = true;
            }

            if (pbDeaths === null || deaths < parseInt(pbDeaths)) {
                pbDeaths = deaths;
                localStorage.setItem('parkour_pbDeaths', pbDeaths);
                isNewPB = true;
            }
        }

        function restartGame() {
            currentLevel = 0;
            score = 0;
            deaths = 0;
            gameWon = false;
            isNewPB = false;
            levelSplits = [];
            splitPopup = { text: '', timer: 0 };
            startTime = Date.now();
            elapsedTime = 0;
            loadLevel(0);
        }

        function resetPlayer() {
            deaths++;
            player.x = 30;
            player.y = 300;
            player.vx = 0;
            player.vy = 0;
        }

        function handleJumpPress() {
            if (player.grounded) {
                player.vy = player.jumpPower;
                player.jumpsLeft = 1;
            } else if (player.wallSlide) {
                player.vy = player.jumpPower;
                player.vx = player.wallDir === 1 ? -12 : 12;
                player.jumpsLeft = 1;
            } else if (player.jumpsLeft > 0) {
                player.vy = player.jumpPower * 0.9;
                player.jumpsLeft--;
            }
        }

        function update() {
            if (gameWon) return;

            elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);

            if (keys[controls.left]) player.vx -= player.speed;
            if (keys[controls.right]) player.vx += player.speed;

            if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
            if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

            player.vx *= friction;
            player.vy += gravity;

            player.wallSlide = false;
            player.wallDir = 0;

            // Horizontal Collision
            player.x += player.vx;
            for (let p of activePlatforms) {
                if (player.x < p.x + p.w && player.x + player.w > p.x &&
                    player.y < p.y + p.h && player.y + player.h > p.y) {
                    
                    if (player.vx > 0) { 
                        player.x = p.x - player.w;
                        player.wallSlide = true;
                        player.wallDir = 1;
                    } else if (player.vx < 0) { 
                        player.x = p.x + p.w;
                        player.wallSlide = true;
                        player.wallDir = -1;
                    }
                    player.vx = 0;
                }
            }

            // Screen Limits
            if (player.x < 0) {
                player.x = 0;
                player.vx = 0;
            } else if (player.x + player.w > canvas.width) {
                player.x = canvas.width - player.w;
                player.vx = 0;
            }

            // Vertical Collision
            player.y += player.vy;
            player.grounded = false;
            for (let p of activePlatforms) {
                if (player.x < p.x + p.w && player.x + player.w > p.x &&
                    player.y < p.y + p.h && player.y + player.h > p.y) {
                    
                    if (player.vy > 0) { 
                        player.y = p.y - player.h;
                        player.grounded = true;
                        player.jumpsLeft = 2;
                    } else if (player.vy < 0) { 
                        player.y = p.y + p.h;
                    }
                    player.vy = 0;
                }
            }

            // Wall Slide
            if (player.wallSlide && player.vy > 0) {
                player.vy *= 0.6; 
                player.jumpsLeft = 1;
            }

            // Hazard Collisions
            for (let h of activeHazards) {
                if (player.x < h.x + h.w && player.x + player.w > h.x &&
                    player.y < h.y + h.h && player.y + player.h > h.y) {
                    resetPlayer();
                }
            }

            if (player.y > canvas.height) {
                resetPlayer();
            }

            // Coin Pickups
            for (let c of activeCoins) {
                if (!c.collected) {
                    let distX = (player.x + player.w / 2) - c.x;
                    let distY = (player.y + player.h / 2) - c.y;
                    if (Math.hypot(distX, distY) < c.r + player.w / 2) {
                        c.collected = true;
                        score += 100;
                    }
                }
            }

            // Next Level Check
            if (player.x < activeGoal.x + activeGoal.w && player.x + player.w > activeGoal.x &&
                player.y < activeGoal.y + activeGoal.h && player.y + player.h > activeGoal.y) {
                
                let lvlTime = ((Date.now() - levelStartTime) / 1000).toFixed(1);
                levelSplits.push(lvlTime);
                
                splitPopup = {
                    text: `⚡ LEVEL ${currentLevel + 1} SPLIT: ${lvlTime}s`,
                    timer: 110
                };

                currentLevel++;
                loadLevel(currentLevel);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Platforms
            ctx.fillStyle = '#2c3e50';
            for (let p of activePlatforms) {
                ctx.fillRect(p.x, p.y, p.w, p.h);
            }

            // Hazards
            ctx.fillStyle = '#e74c3c';
            for (let h of activeHazards) {
                ctx.fillRect(h.x, h.y, h.w, h.h);
            }

            // Coins
            ctx.fillStyle = '#f1c40f';
            for (let c of activeCoins) {
                if (!c.collected) {
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Goal Door
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(activeGoal.x, activeGoal.y, activeGoal.w, activeGoal.h);

            // Player (Color changes when Power key is held)
            ctx.fillStyle = keys[controls.power] ? '#ffcc00' : '#3498db';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Corner Square Indicator
            let cornerSquareSize = 20;
            ctx.fillStyle = '#ffcc00';
            ctx.fillRect(canvas.width - cornerSquareSize - 20, 20, cornerSquareSize, cornerSquareSize);

            // Live HUD
            ctx.fillStyle = '#222';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(`Level: ${currentLevel < levels.length ? currentLevel + 1 : levels.length} / ${levels.length}`, 20, 30);
            ctx.fillText(`Score: ${score}`, 20, 55);
            ctx.fillText(`Deaths: ${deaths}`, 20, 80);
            ctx.fillText(`Time: ${elapsedTime}s`, 20, 105);

            // Personal Best Records Box
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(canvas.width - 230, 70, 210, 60);
            ctx.fillStyle = '#444';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(`PB Time: ${pbTime ? pbTime + 's' : '--'}`, canvas.width - 220, 90);
            ctx.fillText(`PB Deaths: ${pbDeaths !== null ? pbDeaths : '--'}`, canvas.width - 220, 115);

            // Split Time Popup
            if (splitPopup.timer > 0) {
                splitPopup.timer--;
                ctx.fillStyle = 'rgba(20, 20, 20, 0.88)';
                ctx.beginPath();
                ctx.roundRect(canvas.width / 2 - 140, 15, 280, 42, 20);
                ctx.fill();

                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(splitPopup.text, canvas.width / 2, 42);
            }

            // Victory Screen
            if (gameWon) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = '#2ecc71';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('ALL 5 LEVELS CLEARED!', canvas.width / 2, 60);

                if (isNewPB) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 18px sans-serif';
                    ctx.fillText('🏆 NEW PERSONAL BEST RECORD! 🏆', canvas.width / 2, 95);
                }

                ctx.font = '16px sans-serif';
                ctx.fillStyle = '#fff';
                ctx.fillText(`Final Score: ${score} / 1900 | Deaths: ${deaths} | Total Time: ${elapsedTime}s`, canvas.width / 2, 125);

                // Level Splits Table
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.fillRect(canvas.width / 2 - 180, 145, 360, 140);
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 15px sans-serif';
                ctx.fillText('STAGE SPLIT BREAKDOWN', canvas.width / 2, 168);

                ctx.fillStyle = '#e0e0e0';
                ctx.font = '14px monospace';
                for (let i = 0; i < levelSplits.length; i++) {
                    let yPos = 195 + (i * 20);
                    ctx.fillText(`Level ${i + 1}: ${levelSplits[i]}s`, canvas.width / 2, yPos);
                }

                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 16px sans-serif';
                ctx.fillText('Press R to run again!', canvas.width / 2, 330);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        loadLevel(0);
        gameLoop();
    </script>
</body>
</html>
