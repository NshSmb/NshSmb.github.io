<style>
:root{
  --bg:#f5f7fa;
  --card:#fff;
  --text:#263238;
  --muted:#68757d;
  --blue:#1976a8;
  --blue2:#e8f4fa;
  --border:#dfe5e8;
  --shadow:0 8px 25px rgba(0,0,0,.08);
}

*{box-sizing:border-box;scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.65;
}

.container{
  width:min(1050px,92%);
  margin:auto;
}

/* NAV */

nav{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}

.nav-inner{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  color:var(--blue);
  font-weight:800;
  font-size:20px;
}

.nav-links{
  display:flex;
  gap:18px;
  align-items:center;
}

.nav-links a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:bold;
}

.nav-links a:hover{
  color:var(--blue);
}

.languages{
  display:flex;
  gap:5px;
}

.languages button,
.hero button,
.quiz button{
  border:0;
  cursor:pointer;
  font-weight:bold;
  border-radius:20px;
  padding:8px 13px;
}

.languages button{
  background:var(--blue2);
  color:var(--blue);
}

/* HERO */

.hero{
  min-height:480px;
  display:flex;
  align-items:center;
  text-align:center;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(rgba(20,45,60,.55),rgba(20,45,60,.55)),
    url("bavra-hero-image.png")
    center/cover;
  color:white;
}

.hero-content{
  width:min(800px,90%);
  margin:auto;
}

.hero h1{
  font-size:clamp(45px,9vw,82px);
  margin:0;
  letter-spacing:2px;
}

.hero p{
  font-size:20px;
  margin:10px 0 25px;
}

.hero button{
  background:white;
  color:var(--blue);
  padding:12px 22px;
}

/* SECTIONS */

section{
  padding:65px 0;
}

.section-title{
  text-align:center;
  margin-bottom:35px;
}

.section-title h2{
  margin:0;
  color:var(--blue);
  font-size:32px;
}

.section-title p{
  color:var(--muted);
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:22px;
  box-shadow:var(--shadow);
  text-align:center;
}

.card .icon{
  font-size:30px;
}

.card h3{
  color:var(--blue);
  margin:8px 0;
}

/* HISTORY */

.timeline{
  position:relative;
  max-width:800px;
  margin:auto;
}

.timeline::before{
  content:"";
  position:absolute;
  left:20px;
  top:0;
  bottom:0;
  width:3px;
  background:var(--blue);
}

.event{
  position:relative;
  margin:0 0 25px 55px;
  background:var(--card);
  padding:20px;
  border-radius:12px;
  box-shadow:var(--shadow);
}

.event::before{
  content:"";
  position:absolute;
  left:-44px;
  top:23px;
  width:15px;
  height:15px;
  border-radius:50%;
  background:var(--blue);
  border:4px solid var(--bg);
}

.year{
  color:var(--blue);
  font-weight:bold;
  font-size:20px;
}

/* STORY */
